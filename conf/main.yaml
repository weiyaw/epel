# conf folder structure adapted from
# https://hydra.cc/docs/1.3/patterns/configuring_experiments/

defaults:
  - algorithm: hmc
  - _self_

model: kyphosis

prior_sd: 10

seed: 100

verbose: False

id: ${now:%Y-%m-%d}
lastrun: ${now:%Y-%m-%dT%H:%M:%S%z}
git: ${githash:}

hydra:
  run:
    dir: "./outputs/${id}/\
      model=${model}
      ${print_algo:${algorithm}}
      prior=${prior_sd}
      seed=${seed}"
